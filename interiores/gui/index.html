<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Editor de interiores</title>
<style>
  :root { --fondo:#15151a; --panel:#20202a; --panel2:#262632; --borde:#3a3a48; --texto:#e8e8ec; --tenue:#9a9aa8; --acento:#6aa0d8; --aviso:#d8a04a; --peligro:#d86a6a; --generado:#5a7a4a; --modificado:#c98a2a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--fondo); color:var(--texto); font-family: system-ui, sans-serif; font-size: 13px; }
  header { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; background:var(--panel); border-bottom:1px solid var(--borde); }
  header h1 { font-size:15px; margin:0 12px 0 0; white-space:nowrap; }
  header select, header input, header button { background:var(--panel2); color:var(--texto); border:1px solid var(--borde); border-radius:4px; padding:5px 8px; font-size:12px; }
  header button { cursor:pointer; }
  header button:hover { border-color: var(--acento); }
  header .sep { width:1px; align-self:stretch; background:var(--borde); margin:0 6px; }
  .layout { display:grid; grid-template-columns: 220px 1fr 300px; height: calc(100vh - 46px); }
  aside.arbol { background:var(--panel); border-right:1px solid var(--borde); overflow-y:auto; padding:8px; }
  aside.arbol .planta { margin-bottom:8px; }
  aside.arbol .planta > .titulo { font-weight:600; color:var(--tenue); font-size:11px; text-transform:uppercase; letter-spacing:.04em; padding:4px 2px; }
  aside.arbol .sala { padding:5px 8px; border-radius:4px; cursor:pointer; display:flex; justify-content:space-between; gap:6px; }
  aside.arbol .sala:hover { background:var(--panel2); }
  aside.arbol .sala.activa { background:var(--acento); color:#0a0a0f; }
  aside.arbol .sala .dot { width:7px; height:7px; border-radius:50%; flex:none; align-self:center; }
  main.lienzo { position:relative; overflow:auto; display:flex; align-items:center; justify-content:center; background:#1a1a22; background-image: radial-gradient(circle, #24242e 1px, transparent 1px); background-size: 18px 18px; }
  main.lienzo svg { background:#22222c; border-radius:6px; box-shadow:0 0 0 1px var(--borde); }
  aside.panel { background:var(--panel); border-left:1px solid var(--borde); overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:14px; }
  aside.panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--tenue); margin:0 0 8px; }
  .bloque { background:var(--panel2); border:1px solid var(--borde); border-radius:6px; padding:10px; }
  .fila { display:flex; justify-content:space-between; gap:8px; padding:2px 0; }
  .fila .k { color:var(--tenue); }
  .botones { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .botones button, .panel select, .panel input { background:#2c2c38; color:var(--texto); border:1px solid var(--borde); border-radius:4px; padding:5px 8px; font-size:12px; cursor:pointer; }
  .botones button:hover { border-color:var(--acento); }
  .botones button.peligro:hover { border-color:var(--peligro); }
  .paleta-controles { display:flex; flex-direction:column; gap:6px; margin-bottom:8px; }
  .paleta-controles input, .paleta-controles select { width:100%; }
  .paleta { display:flex; flex-direction:column; gap:4px; max-height:320px; overflow-y:auto; }
  .paleta .grupo-cap { font-size:10px; text-transform:uppercase; color:var(--tenue); margin-top:6px; }
  .paleta .contador { color:var(--tenue); font-weight:normal; text-transform:none; }
  .paleta button { text-align:left; display:flex; flex-direction:column; gap:2px; padding:6px 8px; }
  .paleta button .fila-item { display:flex; align-items:center; gap:6px; }
  .paleta button .detalle-item { font-size:10px; color:var(--tenue); padding-left:16px; }
  .paleta button .estructural-item { font-size:10px; color:var(--aviso); padding-left:16px; }
  .paleta button.armado { outline:2px solid var(--acento); }
  .swatch { width:10px; height:10px; border-radius:2px; flex:none; }
  .estado-origen { display:inline-block; font-size:10px; padding:1px 6px; border-radius:8px; }
  .estado-origen.generado { background:var(--generado); color:#eaf5e2; }
  .estado-origen.modificado { background:var(--modificado); color:#2a1c00; }
  .vacio { color:var(--tenue); font-style:italic; padding:20px; text-align:center; }
  .avisos { color:var(--aviso); font-size:11px; margin-top:6px; }
  label.chk { display:flex; align-items:center; gap:5px; color:var(--tenue); font-size:11px; }
  .hint { color:var(--tenue); font-size:11px; line-height:1.5; }
</style>
</head>
<body>
<header>
  <h1>🏠 Editor de interiores</h1>
  <select id="selTipoEdificio"></select>
  <input id="inSemilla" placeholder="semilla" size="14" />
  <select id="selRiqueza"><option value="">riqueza por defecto</option><option>humilde</option><option>modesta</option><option>noble</option></select>
  <select id="selAmueblado"><option value="completo">amueblado: completo</option><option value="fijo">amueblado: fijo</option><option value="vacio">amueblado: vacío</option></select>
  <button id="btnGenerar">⚡ Generar edificio</button>
  <div class="sep"></div>
  <button id="btnVistaEdificio">🏢 Vista edificio</button>
  <div class="sep"></div>
  <label class="chk"><input type="checkbox" id="chkForzar" /> forzar (sobrescribe lo modificado)</label>
  <button id="btnRegenMobiliario">↻ mobiliario de esta sala</button>
  <button id="btnRegenPlanta">↻ esta planta</button>
  <button id="btnRegenEdificio">↻ edificio completo</button>
  <div class="sep"></div>
  <button id="btnGuardar">💾 Guardar</button>
  <span id="estadoTxt" class="hint"></span>
</header>
<div class="layout">
  <aside class="arbol" id="arbol"></aside>
  <main class="lienzo" id="lienzo"><div class="vacio">Genera un edificio para empezar</div></main>
  <aside class="panel">
    <div>
      <h2>Habitación</h2>
      <div class="bloque" id="panelSala"><div class="vacio">—</div></div>
    </div>
    <div>
      <h2>Mueble seleccionado</h2>
      <div class="bloque" id="panelMueble"><div class="vacio">Haz clic en un mueble</div></div>
    </div>
    <div>
      <h2>Catálogo de contenido <span class="hint" id="hintAnadir"></span></h2>
      <div class="bloque">
        <div class="paleta-controles">
          <input id="inBuscarCatalogo" placeholder="buscar por nombre, id o tag…" />
          <select id="selCategoriaCatalogo"><option value="">todas las categorías</option></select>
          <select id="selTagCatalogo"><option value="">todos los tags</option></select>
        </div>
        <div class="paleta" id="paleta"></div>
      </div>
    </div>
  </aside>
</div>
<script>
"use strict";

// ---- Proyección isométrica (misma fórmula que prueba_render_iso.js) ----
const U = 24, UZ = 20, ANG = Math.PI / 6, ALTURA_PARED = 2.4;
function proyectar(x, y, z) { return [(x - y) * Math.cos(ANG) * U, -(x + y) * Math.sin(ANG) * U - z * UZ]; }
function sombrear(hex, factor) {
  const n = parseInt((hex || "#888888").replace("#", ""), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.max(0, Math.min(255, Math.round(r * factor))); g = Math.max(0, Math.min(255, Math.round(g * factor))); b = Math.max(0, Math.min(255, Math.round(b * factor)));
  return "#" + [r, g, b].map((v) => v.toString(16).padStart(2, "0")).join("");
}
function alturaPara(item) {
  if (item.capa === "suciedad") return 0.05;
  if (item.capa === "iluminacion") return 0.3;
  if (["armario", "estanteria", "baul"].some((k) => item.id.includes(k))) return 1.8;
  if (item.id.includes("mesa") || item.id.includes("encimera") || item.id.includes("mostrador")) return 0.8;
  if (item.id.includes("cama")) return 0.6;
  return 1.1;
}
function svgEl(tag, attrs) { const e = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function poligonoEl(puntos, fill, extra) { const e = svgEl("polygon", { points: puntos.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" "), fill, ...(extra || {}) }); return e; }

// ---- Estado del cliente ----
let edificio = null;
let nivelSel = null, indiceSalaSel = null;
let instanceSel = null;
let vistaModo = "sala"; // "sala" (isométrico de una habitación) | "edificio" (planos de todas las plantas)
let elementoArmado = null; // id de catálogo listo para colocar al hacer clic en una casilla
let catalogoElementos = []; // lista plana simple (id/capa/huella) — se mantiene para no romper nada que ya la use
let catalogoContenidoItems = []; // catálogo normalizado (nombre/categoria/subcategoria/tags/dimensiones/reglas) — sección 10
let categoriasCatalogo = [];
let tagsCatalogo = [];
let filtroTexto = "", filtroCategoria = "", filtroTag = "";

const $ = (sel) => document.querySelector(sel);
const estadoTxt = $("#estadoTxt");

async function api(ruta, metodo, body) {
  const r = await fetch(ruta, { method: metodo || "GET", headers: body ? { "Content-Type": "application/json" } : undefined, body: body ? JSON.stringify(body) : undefined });
  return r.json();
}

function salaActual() {
  if (!edificio || nivelSel === null || indiceSalaSel === null) return null;
  const planta = edificio.plantas.find((p) => p.nivel === nivelSel);
  if (!planta) return null;
  return planta.salas[indiceSalaSel] || null;
}

// ---- Árbol edificio → plantas → salas (sección 10: niveles de edición) ----
function renderArbol() {
  const raiz = $("#arbol");
  raiz.innerHTML = "";
  if (!edificio) { raiz.innerHTML = '<div class="vacio">Sin edificio</div>'; return; }
  const cab = document.createElement("div");
  cab.innerHTML = `<div style="font-weight:600;margin-bottom:8px">${edificio.tipoEdificioId}<br><span class="hint">${edificio.id}</span></div>`;
  raiz.appendChild(cab);
  for (const planta of edificio.plantas.slice().sort((a, b) => b.nivel - a.nivel)) {
    const div = document.createElement("div");
    div.className = "planta";
    const t = document.createElement("div");
    t.className = "titulo";
    t.textContent = `Planta ${planta.nivel} (${planta.rol})`;
    div.appendChild(t);
    planta.salas.forEach((s, i) => {
      const el = document.createElement("div");
      el.className = "sala" + (planta.nivel === nivelSel && i === indiceSalaSel ? " activa" : "");
      const origenColor = s.resultado.origen === "modificado" ? "var(--modificado)" : "var(--generado)";
      el.innerHTML = `<span><span class="dot" style="background:${origenColor};display:inline-block;margin-right:6px"></span>${s.tipoSalaId}${s.esPasillo ? " (pasillo)" : ""}</span><span class="hint">${s.resultado.ancho}x${s.resultado.largo}</span>`;
      el.onclick = () => { nivelSel = planta.nivel; indiceSalaSel = i; instanceSel = null; elementoArmado = null; vistaModo = "sala"; renderTodo(); };
      div.appendChild(el);
    });
    raiz.appendChild(div);
  }
}

// ---- Panel de habitación (sección 8) ----
function renderPanelSala() {
  const panel = $("#panelSala");
  const s = salaActual();
  if (!s) { panel.innerHTML = '<div class="vacio">—</div>'; return; }
  const r = s.resultado;
  const tipoInfo = catalogoTiposSala.find((t) => t.id === r.tipoSalaId);
  const estadisticasTxt = Object.entries(r.estadisticas || {}).map(([k, v]) => `${k}:${v}`).join(" · ") || "—";
  panel.innerHTML = `
    <div class="fila"><span class="k">Tipo</span><span>${tipoInfo ? tipoInfo.nombre : r.tipoSalaId} <span class="estado-origen ${r.origen}">${r.origen}</span></span></div>
    <div class="fila"><span class="k">Categoría</span><span>${tipoInfo ? tipoInfo.categoria : "—"}</span></div>
    <div class="fila"><span class="k">Piso</span><span>${s.nivel} (${s.rol})</span></div>
    <div class="fila"><span class="k">Tamaño</span><span>${r.ancho}x${r.largo} tiles</span></div>
    <div class="fila"><span class="k">Riqueza</span><span>${r.riqueza}</span></div>
    <div class="fila"><span class="k">Muebles</span><span>${r.colocados.length + r.colgados.length + r.techo.length}</span></div>
    <div class="fila"><span class="k">Estadísticas</span><span>${estadisticasTxt}</span></div>
    <div class="botones">
      <select id="selCambiarTipoSala"></select>
      <button id="btnCambiarTipoSala">Cambiar tipo de sala</button>
    </div>`;
  const sel = $("#selCambiarTipoSala");
  sel.innerHTML = catalogoTiposSala.map((t) => `<option value="${t.id}" ${t.id === r.tipoSalaId ? "selected" : ""}>${t.nombre}</option>`).join("");
  $("#btnCambiarTipoSala").onclick = async () => {
    const res = await api("/api/editar/cambiarTipoSala", "POST", { nivel: nivelSel, indiceSala: indiceSalaSel, nuevoTipoSalaId: sel.value });
    if (res.ok) { s.resultado.tipoSalaId = res.resultado.tipoSalaId; s.resultado.materialSuelo = res.resultado.materialSuelo; s.resultado.materialPared = res.resultado.materialPared; s.resultado.origen = res.resultado.origen; s.tipoSalaId = res.resultado.tipoSalaId; renderTodo(); }
    else avisar(res);
  };
}

// ---- Panel de mueble seleccionado (sección 4/9) ----
function renderPanelMueble() {
  const panel = $("#panelMueble");
  const s = salaActual();
  const item = s && instanceSel ? buscarItemCliente(s.resultado, instanceSel) : null;
  if (!item) { panel.innerHTML = '<div class="vacio">Haz clic en un mueble</div>'; return; }
  const estadoTxt = item.estado ? Object.entries(item.estado).filter(([, v]) => v).map(([k]) => k).join(", ") || "intacto" : "—";
  panel.innerHTML = `
    <div class="fila"><span class="k">Pieza</span><span>${item.id} <span class="estado-origen ${item.origen}">${item.origen}</span></span></div>
    ${item.variante ? `<div class="fila"><span class="k">Variante</span><span>${item.variante}</span></div>` : ""}
    <div class="fila"><span class="k">Posición</span><span>${item.x !== undefined ? `(${item.x}, ${item.y})` : "—"}</span></div>
    <div class="fila"><span class="k">Rotación</span><span>${item.rotacion ?? 0}°</span></div>
    <div class="fila"><span class="k">Estado</span><span>${estadoTxt}</span></div>
    <div class="botones">
      <button id="btnRoto">${item.estado?.roto ? "✓ roto" : "marcar roto"}</button>
      <button id="btnSucio">${item.estado?.sucio ? "✓ sucio" : "marcar sucio"}</button>
    </div>
    <div class="botones">
      <button id="btnRotar">🔄 Rotar 90°</button>
      <button id="btnDuplicar">⧉ Duplicar</button>
      <button id="btnEliminar" class="peligro">🗑 Eliminar</button>
    </div>
    <div style="margin-top:10px">
      <select id="selSustituir"></select>
      <button id="btnSustituir">Sustituir</button>
    </div>
    <div class="hint" style="margin-top:8px">Flechas: mover 1 tile · Supr: eliminar · R: rotar</div>
    <div class="avisos" id="avisosMueble"></div>`;
  $("#selSustituir").innerHTML = catalogoContenidoItems.filter((it) => !it.estructural).map((it) => `<option value="${it.id}" ${it.id === item.id ? "selected" : ""}>${it.nombre}</option>`).join("");
  $("#btnRotar").onclick = () => rotarSeleccionado();
  $("#btnDuplicar").onclick = () => duplicarSeleccionado();
  $("#btnEliminar").onclick = () => eliminarSeleccionado();
  $("#btnSustituir").onclick = () => sustituirSeleccionado($("#selSustituir").value);
  $("#btnRoto").onclick = () => cambiarEstadoSeleccionado({ roto: !item.estado?.roto });
  $("#btnSucio").onclick = () => cambiarEstadoSeleccionado({ sucio: !item.estado?.sucio });
}

function buscarItemCliente(resultado, instanceId) {
  for (const it of resultado.colocados) { if (it.instanceId === instanceId) return it; for (const s of it.sobre || []) if (s.instanceId === instanceId) return s; }
  for (const it of resultado.colgados) if (it.instanceId === instanceId) return it;
  for (const it of resultado.techo) if (it.instanceId === instanceId) return it;
  return null;
}

function avisar(res) {
  const div = $("#avisosMueble");
  if (!res) return;
  const texto = (res.avisos || []).join(", ") || res.error || "";
  if (!texto) return;
  if (res.requiereForzar) {
    if (confirm(`Aviso: ${texto}\n¿Aplicar de todas formas?`)) return "reintentar";
  } else if (div) {
    div.textContent = texto;
  } else if (texto) {
    console.warn(texto);
  }
  return null;
}

// ---- Acciones de edición (sección 4/7/9) ----
async function moverSeleccionado(dx, dy, forzar) {
  const s = salaActual(); const item = buscarItemCliente(s.resultado, instanceSel);
  if (!item || item.x === undefined) return;
  const res = await api("/api/editar/mover", "POST", { nivel: nivelSel, indiceSala: indiceSalaSel, instanceId: instanceSel, x: item.x + dx, y: item.y + dy, forzar });
  if (!res.ok && res.requiereForzar && confirm(`Aviso: ${res.avisos.join(", ")}\n¿Mover de todas formas?`)) return moverSeleccionado(dx, dy, true);
  if (res.ok) { s.resultado = res.resultado; renderTodo(); } else avisar(res);
}
async function rotarSeleccionado(forzar) {
  const s = salaActual(); const item = buscarItemCliente(s.resultado, instanceSel);
  if (!item) return;
  const siguiente = [0, 90, 180, 270][([0, 90, 180, 270].indexOf(item.rotacion || 0) + 1) % 4];
  const res = await api("/api/editar/rotar", "POST", { nivel: nivelSel, indiceSala: indiceSalaSel, instanceId: instanceSel, grados: siguiente, forzar });
  if (!res.ok && res.requiereForzar && confirm(`Aviso: ${res.avisos.join(", ")}\n¿Rotar de todas formas?`)) return rotarSeleccionado(true);
  if (res.ok) { s.resultado = res.resultado; renderTodo(); } else avisar(res);
}
async function eliminarSeleccionado() {
  const res = await api("/api/editar/eliminar", "POST", { nivel: nivelSel, indiceSala: indiceSalaSel, instanceId: instanceSel });
  if (res.ok) { instanceSel = null; const s = salaActual(); s.resultado = res.resultado; renderTodo(); }
}
async function duplicarSeleccionado() {
  const res = await api("/api/editar/duplicar", "POST", { nivel: nivelSel, indiceSala: indiceSalaSel, instanceId: instanceSel });
  if (res.ok) { const s = salaActual(); s.resultado = res.resultado; instanceSel = res.instanceId; renderTodo(); } else avisar(res);
}
async function sustituirSeleccionado(nuevoElementoId) {
  const res = await api("/api/editar/sustituir", "POST", { nivel: nivelSel, indiceSala: indiceSalaSel, instanceId: instanceSel, nuevoElementoId });
  if (res.ok) { const s = salaActual(); s.resultado = res.resultado; renderTodo(); } else avisar(res);
}
async function cambiarEstadoSeleccionado(cambios) {
  const res = await api("/api/editar/cambiarEstado", "POST", { nivel: nivelSel, indiceSala: indiceSalaSel, instanceId: instanceSel, cambios });
  if (res.ok) { const s = salaActual(); s.resultado = res.resultado; renderTodo(); }
}
async function anadirEnTile(x, y, forzar) {
  const res = await api("/api/editar/anadir", "POST", { nivel: nivelSel, indiceSala: indiceSalaSel, elementoId: elementoArmado, x, y, forzar });
  if (!res.ok && res.requiereForzar && confirm(`Aviso: ${res.avisos.join(", ")}\n¿Añadir de todas formas?`)) return anadirEnTile(x, y, true);
  if (res.ok) { const s = salaActual(); s.resultado = res.resultado; instanceSel = res.instanceId; elementoArmado = null; renderTodo(); }
  else avisar(res);
}

// ---- Catálogo de contenido: navegar por categoría, buscar, filtrar por
// tag, y colocar la pieza elegida (sección 10 del pedido de catálogo de
// contenido) — sustituye la lista plana de antes por la consulta real al
// catálogo normalizado (categoria/subcategoria/tags/dimensiones/reglas).
function itemsFiltradosCatalogo() {
  let items = catalogoContenidoItems;
  if (filtroCategoria) items = items.filter((it) => it.categoria === filtroCategoria);
  if (filtroTag) items = items.filter((it) => it.tags.includes(filtroTag));
  if (filtroTexto) {
    const q = filtroTexto.toLowerCase();
    items = items.filter((it) => it.id.includes(q) || it.nombre.toLowerCase().includes(q) || it.tags.some((t) => t.includes(q)));
  }
  return items;
}

function renderPaleta() {
  const cont = $("#paleta");
  const items = itemsFiltradosCatalogo();
  const porCategoria = {};
  for (const it of items) (porCategoria[it.categoria] = porCategoria[it.categoria] || []).push(it);
  cont.innerHTML = "";
  for (const categoria of Object.keys(porCategoria).sort()) {
    const t = document.createElement("div");
    t.className = "grupo-cap";
    t.innerHTML = `${categoria} <span class="contador">(${porCategoria[categoria].length})</span>`;
    cont.appendChild(t);
    for (const it of porCategoria[categoria]) {
      const b = document.createElement("button");
      const dims = `${it.dimensiones.ancho}x${it.dimensiones.largo} tiles`;
      const tagsTxt = it.tags.slice(0, 4).join(", ");
      b.innerHTML = `
        <span class="fila-item"><span class="swatch" style="background:${it.colorDebug || "#888"}"></span>${it.nombre}</span>
        <span class="detalle-item">${dims} · ${tagsTxt}</span>
        ${it.estructural ? '<span class="estructural-item">estructural — aún no colocable como instancia suelta</span>' : ""}`;
      b.title = `${it.nombre} (${it.id})\n${it.subcategoria} · ${dims}\ntags: ${it.tags.join(", ")}\npuedeSolapar: ${it.reglas.puedeSolapar} · requierePared: ${it.reglas.requierePared}`;
      if (it.estructural) b.disabled = true;
      if (elementoArmado === it.id) b.classList.add("armado");
      b.onclick = () => { elementoArmado = elementoArmado === it.id ? null : it.id; renderTodo(); };
      cont.appendChild(b);
    }
  }
  if (items.length === 0) cont.innerHTML = '<div class="vacio">Sin resultados</div>';
  const armadoInfo = elementoArmado ? catalogoContenidoItems.find((it) => it.id === elementoArmado) : null;
  $("#hintAnadir").textContent = armadoInfo ? `→ clic en una casilla libre para colocar "${armadoInfo.nombre}"` : "";
}

// ---- Lienzo isométrico interactivo ----
function renderLienzo() {
  const cont = $("#lienzo");
  cont.style.display = "";
  cont.style.overflow = "";
  const s = salaActual();
  if (!s) { cont.innerHTML = '<div class="vacio">Genera un edificio y selecciona una sala</div>'; return; }
  const r = s.resultado;
  const esquinas = [proyectar(0, 0, 0), proyectar(r.ancho, 0, 0), proyectar(0, r.largo, 0), proyectar(r.ancho, r.largo, ALTURA_PARED)];
  const xs = esquinas.map((p) => p[0]), ys = esquinas.map((p) => p[1]);
  const margen = 40;
  const minX = Math.min(...xs) - margen, maxX = Math.max(...xs) + margen;
  const minY = Math.min(...ys) - margen, maxY = Math.max(...ys) + margen + 20;
  const svg = svgEl("svg", { width: (maxX - minX).toFixed(0), height: (maxY - minY).toFixed(0), viewBox: `${minX.toFixed(1)} ${minY.toFixed(1)} ${(maxX - minX).toFixed(1)} ${(maxY - minY).toFixed(1)}`, "font-family": "monospace" });

  // suelo
  svg.appendChild(poligonoEl([proyectar(0, 0, 0), proyectar(r.ancho, 0, 0), proyectar(r.ancho, r.largo, 0), proyectar(0, r.largo, 0)], "#c9b896", { stroke: "#0004", "stroke-width": 0.5 }));

  // casillas clicables (para mover-aquí / añadir-aquí) — el muro no ocupa
  // casilla propia (colocarElementos.js), todo el rectángulo r.ancho x
  // r.largo es suelo real.
  for (let y = 0; y < r.largo; y++) {
    for (let x = 0; x < r.ancho; x++) {
      const p0 = proyectar(x, y, 0.01), p1 = proyectar(x + 1, y, 0.01), p2 = proyectar(x + 1, y + 1, 0.01), p3 = proyectar(x, y + 1, 0.01);
      const tile = poligonoEl([p0, p1, p2, p3], "transparent", { style: "cursor:pointer" });
      tile.addEventListener("click", () => {
        if (elementoArmado) anadirEnTile(x, y);
        else if (instanceSel) { const item = buscarItemCliente(r, instanceSel); if (item && item.x !== undefined) apiMoverA(x, y); }
      });
      svg.appendChild(tile);
    }
  }

  // muros sur/este sólidos (con hueco de puerta), mismo criterio que prueba_render_iso.js
  const colorParedOscuro = sombrear("#8a8a8a", 0.75);
  for (let x = 0; x < r.ancho; x++) {
    if (r.puerta.lado === "sur" && x === r.puerta.x) continue;
    const p0 = proyectar(x, r.largo, 0), p1 = proyectar(x + 1, r.largo, 0), p2 = proyectar(x + 1, r.largo, ALTURA_PARED), p3 = proyectar(x, r.largo, ALTURA_PARED);
    svg.appendChild(poligonoEl([p0, p1, p2, p3], colorParedOscuro, { stroke: "#0006", "stroke-width": 0.6 }));
  }
  const colorParedClaro = sombrear("#8a8a8a", 0.9);
  for (let y = 0; y < r.largo; y++) {
    const p0 = proyectar(r.ancho, y, 0), p1 = proyectar(r.ancho, y + 1, 0), p2 = proyectar(r.ancho, y + 1, ALTURA_PARED), p3 = proyectar(r.ancho, y, ALTURA_PARED);
    svg.appendChild(poligonoEl([p0, p1, p2, p3], colorParedClaro, { stroke: "#0006", "stroke-width": 0.6 }));
  }

  // mobiliario, ordenado por profundidad
  const ordenados = r.colocados.slice().sort((a, b) => (a.x + a.y) - (b.x + b.y));
  for (const it of ordenados) dibujarCaja(svg, it, it.instanceId === instanceSel);

  const puertaLbl = proyectar(r.puerta.x + 0.5, r.largo, 0);
  const txt = svgEl("text", { x: puertaLbl[0].toFixed(1), y: (puertaLbl[1] + 14).toFixed(1), "font-size": 8, fill: "#ccc", "text-anchor": "middle" });
  txt.textContent = "puerta"; svg.appendChild(txt);

  cont.innerHTML = "";
  cont.appendChild(svg);
}

// ---- Vista de edificio completo: planos 2D de todas las plantas apiladas
// (nivel más alto arriba), cada sala en su offsetX/offsetY real dentro de
// la rejilla de planta, con las puertas compartidas entre salas vecinas
// marcadas — reutiliza tal cual los datos que edificio.js/generarPlanta ya
// calcula (salaPlanta.puertas = coordenadas globales de puerta detectadas
// por detectarSalas; una coordenada que aparece en el `puertas` de DOS
// salas es, por definición, la conexión entre ambas). No hace falta pedir
// nada nuevo al servidor: todo esto ya viaja en /api/generar y /api/edificio.
function colorParaTipoSala(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return `hsl(${h % 360}, 42%, 52%)`;
}

// El conector vertical (escalera/trampilla) de una planta apunta a uno de
// sus `salas[]` por referencia de objeto en memoria del servidor, pero esa
// referencia concreta no viaja serializada (sus Sets internos se pierden
// en el JSON) — se re-localiza por offset, que sí es un valor plano.
function salaConectorDe(planta) {
  const sc = planta.salaConector;
  if (!sc) return null;
  return planta.salas.find((s) => s.offsetX === sc.offsetX && s.offsetY === sc.offsetY && s.tipoSalaId === sc.tipoSalaId) || null;
}

function renderVistaEdificio() {
  const cont = $("#lienzo");
  cont.style.display = "block";
  cont.style.overflow = "auto";
  if (!edificio) { cont.innerHTML = '<div class="vacio">Genera un edificio para empezar</div>'; return; }
  const ESCALA = 15;
  const plantasOrden = edificio.plantas.slice().sort((a, b) => b.nivel - a.nivel);

  const wrap = document.createElement("div");
  wrap.style.cssText = "display:flex;flex-direction:column;gap:10px;padding:22px;align-items:flex-start;";
  const leyenda = document.createElement("div");
  leyenda.className = "hint";
  leyenda.style.marginBottom = "6px";
  leyenda.innerHTML = "Plantas de arriba a abajo (nivel más alto primero). <span style=\"color:#e8d8a0\">■</span> puerta entre dos salas · <span style=\"color:#e8d8a066\">■</span> puerta hacia fuera de la planta · <span style=\"color:#ffe08a\">⬍</span> conector vertical con la planta contigua. Clic en una sala para abrir su vista de habitación.";
  wrap.appendChild(leyenda);

  for (const planta of plantasOrden) {
    const anchoPx = Math.max(1, planta.ancho) * ESCALA, altoPx = Math.max(1, planta.alto) * ESCALA;
    const svg = svgEl("svg", { width: anchoPx, height: altoPx, viewBox: `0 0 ${anchoPx} ${altoPx}`, style: "background:#14141a;border-radius:4px;box-shadow:0 0 0 1px var(--borde);" });

    // puertas: coordenada global -> índices de sala que la tienen en su
    // salaPlanta.puertas (2 dueños = conexión interna, 1 = hacia fuera).
    const dueñosPuerta = new Map();
    planta.salas.forEach((s, i) => {
      for (const clave of (s.salaPlanta ? s.salaPlanta.puertas : [])) {
        if (!dueñosPuerta.has(clave)) dueñosPuerta.set(clave, []);
        dueñosPuerta.get(clave).push(i);
      }
    });

    const conectorSala = salaConectorDe(planta);

    planta.salas.forEach((s, i) => {
      const r = s.resultado;
      const x = s.offsetX * ESCALA, y = s.offsetY * ESCALA, w = r.ancho * ESCALA, h = r.largo * ESCALA;
      const seleccionada = planta.nivel === nivelSel && i === indiceSalaSel;
      const g = svgEl("g", { style: "cursor:pointer" });
      g.appendChild(svgEl("rect", { x, y, width: w, height: h, fill: colorParaTipoSala(s.tipoSalaId), stroke: seleccionada ? "#fff" : "#00000070", "stroke-width": seleccionada ? 2.4 : 1 }));
      if (s.esPasillo) g.appendChild(svgEl("rect", { x: x + 1.5, y: y + 1.5, width: Math.max(0, w - 3), height: Math.max(0, h - 3), fill: "none", stroke: "#ffffff70", "stroke-dasharray": "3 2" }));
      const txt = svgEl("text", { x: x + w / 2, y: y + h / 2, "font-size": Math.min(10, ESCALA * 0.72), fill: "#000a", "text-anchor": "middle", "dominant-baseline": "middle", stroke: "#fffb", "stroke-width": 2.5, style: "paint-order:stroke" });
      txt.textContent = s.tipoSalaId;
      g.appendChild(txt);
      if (conectorSala && conectorSala.offsetX === s.offsetX && conectorSala.offsetY === s.offsetY) {
        g.appendChild(svgEl("text", { x: x + w / 2, y: y + h - 5, "font-size": 10, fill: "#ffe08a", "text-anchor": "middle" })).textContent = "⬍";
      }
      g.addEventListener("click", () => { nivelSel = planta.nivel; indiceSalaSel = i; instanceSel = null; elementoArmado = null; vistaModo = "sala"; renderTodo(); });
      svg.appendChild(g);
    });

    for (const [clave, duenos] of dueñosPuerta) {
      const [gx, gy] = clave.split("_").map(Number);
      svg.appendChild(svgEl("rect", { x: gx * ESCALA, y: gy * ESCALA, width: ESCALA, height: ESCALA, fill: duenos.length > 1 ? "#e8d8a0" : "#e8d8a066" }));
    }

    const cab = document.createElement("div");
    cab.style.cssText = "font-size:12px;color:var(--tenue);";
    cab.textContent = `Planta ${planta.nivel} (${planta.rol}) — ${planta.salas.length} salas`;
    const bloque = document.createElement("div");
    bloque.appendChild(cab);
    bloque.appendChild(svg);
    wrap.appendChild(bloque);
  }

  cont.innerHTML = "";
  cont.appendChild(wrap);
}

async function apiMoverA(x, y) {
  const s = salaActual();
  const res = await api("/api/editar/mover", "POST", { nivel: nivelSel, indiceSala: indiceSalaSel, instanceId: instanceSel, x, y });
  if (!res.ok && res.requiereForzar && confirm(`Aviso: ${res.avisos.join(", ")}\n¿Mover de todas formas?`)) {
    const res2 = await api("/api/editar/mover", "POST", { nivel: nivelSel, indiceSala: indiceSalaSel, instanceId: instanceSel, x, y, forzar: true });
    if (res2.ok) { s.resultado = res2.resultado; renderTodo(); }
    return;
  }
  if (res.ok) { s.resultado = res.resultado; renderTodo(); }
}

function dibujarCaja(svg, item, seleccionado) {
  const h = alturaPara(item);
  const colorBase = item.colorDebug || "#999";
  const top = sombrear(colorBase, 1.15), caraA = sombrear(colorBase, 0.85), caraB = sombrear(colorBase, 0.7);
  const A0 = proyectar(item.x, item.y, 0), A1 = proyectar(item.x, item.y, h);
  const B0 = proyectar(item.x + item.ancho, item.y, 0), B1 = proyectar(item.x + item.ancho, item.y, h);
  const C1 = proyectar(item.x + item.ancho, item.y + item.largo, h);
  const D0 = proyectar(item.x, item.y + item.largo, 0), D1 = proyectar(item.x, item.y + item.largo, h);
  const g = svgEl("g", { style: "cursor:pointer" });
  const borde = seleccionado ? "#fff" : "#0006";
  const grosor = seleccionado ? 1.6 : 0.6;
  g.appendChild(poligonoEl([A0, B0, B1, A1], caraA, { stroke: borde, "stroke-width": grosor }));
  g.appendChild(poligonoEl([A0, A1, D1, D0], caraB, { stroke: borde, "stroke-width": grosor }));
  g.appendChild(poligonoEl([A1, B1, C1, D1], top, { stroke: borde, "stroke-width": grosor }));
  const [lx, ly] = proyectar(item.x + item.ancho / 2, item.y + item.largo / 2, h);
  const txt = svgEl("text", { x: lx.toFixed(1), y: ly.toFixed(1), "font-size": 7, fill: "#000", "text-anchor": "middle", stroke: "#fff", "stroke-width": 2.5, style: "paint-order:stroke" });
  txt.textContent = item.id.slice(0, 12);
  g.appendChild(txt);
  g.addEventListener("click", (ev) => { ev.stopPropagation(); instanceSel = item.instanceId; elementoArmado = null; renderTodo(); });
  svg.appendChild(g);
}

// ---- Teclado: mover/rotar/eliminar la pieza seleccionada ----
document.addEventListener("keydown", (ev) => {
  if (!instanceSel) return;
  if (ev.key === "ArrowUp") moverSeleccionado(0, -1);
  else if (ev.key === "ArrowDown") moverSeleccionado(0, 1);
  else if (ev.key === "ArrowLeft") moverSeleccionado(-1, 0);
  else if (ev.key === "ArrowRight") moverSeleccionado(1, 0);
  else if (ev.key.toLowerCase() === "r") rotarSeleccionado();
  else if (ev.key === "Delete" || ev.key === "Backspace") eliminarSeleccionado();
  else if (ev.key === "Escape") { instanceSel = null; elementoArmado = null; renderTodo(); }
  else return;
  ev.preventDefault();
});

function renderTodo() {
  renderArbol(); renderPanelSala(); renderPanelMueble(); renderPaleta();
  if (vistaModo === "edificio") renderVistaEdificio(); else renderLienzo();
  $("#btnVistaEdificio").textContent = vistaModo === "edificio" ? "🚪 Vista habitación" : "🏢 Vista edificio";
}

// ---- Arranque ----
let catalogoTiposSala = [];
async function iniciar() {
  const [tiposEdificio, tiposSala, elementos, catalogo] = await Promise.all([
    api("/api/tiposEdificio"), api("/api/tiposSala"), api("/api/elementos"), api("/api/catalogo"),
  ]);
  $("#selTipoEdificio").innerHTML = tiposEdificio.tiposEdificio.map((t) => `<option>${t}</option>`).join("");
  catalogoTiposSala = tiposSala.tiposSala;
  catalogoElementos = elementos.elementos;
  catalogoContenidoItems = catalogo.items;
  categoriasCatalogo = catalogo.categorias;
  tagsCatalogo = catalogo.tags;

  $("#selCategoriaCatalogo").innerHTML = '<option value="">todas las categorías</option>' + categoriasCatalogo.map((c) => `<option value="${c}">${c}</option>`).join("");
  $("#selTagCatalogo").innerHTML = '<option value="">todos los tags</option>' + tagsCatalogo.map((t) => `<option value="${t}">${t}</option>`).join("");
  $("#inBuscarCatalogo").oninput = (ev) => { filtroTexto = ev.target.value; renderPaleta(); };
  $("#selCategoriaCatalogo").onchange = (ev) => { filtroCategoria = ev.target.value; renderPaleta(); };
  $("#selTagCatalogo").onchange = (ev) => { filtroTag = ev.target.value; renderPaleta(); };

  const actual = await api("/api/edificio");
  if (actual.edificio) { edificio = actual.edificio; nivelSel = edificio.plantas[0].nivel; indiceSalaSel = 0; }
  renderTodo();
}

$("#btnGenerar").onclick = async () => {
  estadoTxt.textContent = "generando…";
  const res = await api("/api/generar", "POST", {
    tipoEdificioId: $("#selTipoEdificio").value,
    semilla: $("#inSemilla").value || undefined,
    riqueza: $("#selRiqueza").value || undefined,
    amueblado: $("#selAmueblado").value,
  });
  estadoTxt.textContent = "";
  if (res.ok) { edificio = res.edificio; nivelSel = edificio.plantas[0].nivel; indiceSalaSel = 0; instanceSel = null; renderTodo(); }
};

$("#btnVistaEdificio").onclick = () => {
  vistaModo = vistaModo === "edificio" ? "sala" : "edificio";
  renderTodo();
};

$("#btnRegenMobiliario").onclick = async () => {
  if (nivelSel === null) return;
  const res = await api("/api/regenerar/mobiliario", "POST", { nivel: nivelSel, indiceSala: indiceSalaSel, forzar: $("#chkForzar").checked });
  if (res.resultado) { const s = salaActual(); s.resultado = res.resultado; instanceSel = null; renderTodo(); estadoTxt.textContent = res.conservadas !== undefined ? `conservadas ${res.conservadas}, nuevas ${res.nuevas}` : (res.avisos || []).join(", "); }
};
$("#btnRegenPlanta").onclick = async () => {
  if (nivelSel === null) return;
  const res = await api("/api/regenerar/planta", "POST", { nivel: nivelSel, forzar: $("#chkForzar").checked });
  if (res.ok) { edificio = res.edificio; instanceSel = null; renderTodo(); }
};
$("#btnRegenEdificio").onclick = async () => {
  const res = await api("/api/regenerar/edificio", "POST", { forzar: $("#chkForzar").checked });
  if (res.ok) { edificio = res.edificio; instanceSel = null; renderTodo(); }
};
$("#btnGuardar").onclick = async () => {
  const res = await api("/api/guardar", "POST", {});
  estadoTxt.textContent = res.ok ? `guardado en ${res.archivo}` : (res.error || "error al guardar");
};

iniciar();
</script>
